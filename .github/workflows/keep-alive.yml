name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 * * 1,4'   # every Monday & Thursday at 06:00 UTC
  workflow_dispatch:         # lets you trigger it manually too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X POST "${{ https://rfxoxogbucfqqynslszw.supabase.co }}/rest/v1/heartbeat" \
            -H "apikey: ${{ eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmeG94b2didWNmcXF5bnNsc3p3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NzU0NDcsImV4cCI6MjA5MDI1MTQ0N30.xfCa6oq2ZYfcqW-8A9wSw-7nfOCeofaulfZmb1rPJcE }}" \
            -H "Authorization: Bearer ${{ eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmeG94b2didWNmcXF5bnNsc3p3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NzU0NDcsImV4cCI6MjA5MDI1MTQ0N30.xfCa6oq2ZYfcqW-8A9wSw-7nfOCeofaulfZmb1rPJcE }}" \
